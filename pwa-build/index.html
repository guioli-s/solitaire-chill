<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3c28">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Paciência</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div id="app">
  <header class="header">
    <h1 class="header-title"></h1>
    <div class="stats">
      <div class="stat" id="stat-score"><span class="stat-label">Pontos</span><span class="stat-value" id="score-value">0</span></div>
      <div class="stat" id="stat-moves"><span class="stat-label">Jogadas</span><span class="stat-value" id="moves-value">0</span></div>
      <div class="stat" id="stat-time"><span class="stat-label">Tempo</span><span class="stat-value" id="timer-value">00:00</span></div>
      <button class="btn btn-icon" id="btn-settings" aria-label="Configurações" style="background:transparent; border:none; color:var(--tl); font-size:18px; padding:0 0 0 4px; margin:0; cursor:pointer;">&#9881;</button>
    </div>
  </header>
  <main id="board"></main>
  <div class="bottom-bar">
    <button class="btn btn-new-game" id="btn-new-game"><span class="btn-icon">🔄</span><span>Novo Jogo</span></button>
    <button class="btn btn-undo disabled" id="btn-undo"><span class="btn-icon">↩️</span><span>Desfazer</span></button>
  </div>
  <button class="fab-autocomplete" id="btn-autocomplete">Finalizar Jogo ⚡</button>
</div>
<div class="overlay" id="win-overlay">
  <div class="overlay-content">
    <span class="overlay-emoji">🏆</span>
    <h2 class="overlay-title">Parabéns!</h2>
    <div class="overlay-stats">
      <div class="overlay-stat"><span class="overlay-stat-value" id="win-score">0</span><span class="overlay-stat-label">Pontos</span></div>
      <div class="overlay-stat"><span class="overlay-stat-value" id="win-moves">0</span><span class="overlay-stat-label">Jogadas</span></div>
      <div class="overlay-stat"><span class="overlay-stat-value" id="win-time">00:00</span><span class="overlay-stat-label">Tempo</span></div>
    </div>
    <div class="overlay-buttons"><button class="overlay-btn overlay-btn-primary" id="win-new-game">Jogar Novamente</button></div>
  </div>
</div>
<div class="overlay" id="lose-overlay">
  <div class="overlay-content">
    <span class="overlay-emoji">😔</span>
    <h2 class="overlay-title">Sem Jogadas</h2>
    <p class="overlay-subtitle">Não há mais movimentos possíveis.</p>
    <div class="overlay-buttons">
      <button class="overlay-btn overlay-btn-primary" id="lose-new-game">Novo Jogo</button>
      <button class="overlay-btn overlay-btn-secondary" id="lose-undo">↩️ Desfazer Jogada</button>
    </div>
  </div>
</div>

  <div id="settings-overlay" class="overlay">
    <div class="overlay-content settings-content">
      <h2>Configurações</h2>
      <div class="setting-row">
        <div class="setting-label">
          <span class="setting-title">Mão do Jogador</span>
          <span class="setting-desc">Posição do monte</span>
        </div>
        <div class="setting-control">
          <span class="toggle-label left">Esq</span>
          <label class="toggle-switch"><input type="checkbox" id="toggle-handedness" checked><span class="toggle-slider"></span></label>
          <span class="toggle-label right">Dir</span>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">
          <span class="setting-title">Modo Noturno</span>
          <span class="setting-desc">Cores escuras</span>
        </div>
        <div class="setting-control">
          <label class="toggle-switch"><input type="checkbox" id="toggle-darkmode"><span class="toggle-slider"></span></label>
        </div>
      </div>
      <div class="setting-section-title">Estatísticas</div>
      <div class="setting-row">
        <span class="setting-title">Pontos</span>
        <div class="setting-control"><label class="toggle-switch"><input type="checkbox" id="toggle-score" checked><span class="toggle-slider"></span></label></div>
      </div>
      <div class="setting-row">
        <span class="setting-title">Movimentos</span>
        <div class="setting-control"><label class="toggle-switch"><input type="checkbox" id="toggle-moves" checked><span class="toggle-slider"></span></label></div>
      </div>
      <div class="setting-row">
        <span class="setting-title">Tempo</span>
        <div class="setting-control"><label class="toggle-switch"><input type="checkbox" id="toggle-time" checked><span class="toggle-slider"></span></label></div>
      </div>
      <button class="btn btn-primary" id="btn-close-settings" style="margin-top:15px;width:100%">Fechar</button>
    </div>
  </div>
</body>
<script src="./logic.js"></script>
<script src="./ui.js"></script>
<script src="./app.js"></script>
</body>
</html>
